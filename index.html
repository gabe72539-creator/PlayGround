<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rope to the Sun</title>
<style>
:root{--ink:#2f2940;--cream:#fff7dc}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#17172b;color:var(--ink);font-family:Georgia,'Times New Roman',serif;touch-action:none}canvas{display:block;width:100%;height:100%}.ui{position:absolute;inset:0;pointer-events:none}.top{position:absolute;top:18px;left:22px;right:22px;display:flex;align-items:flex-start;justify-content:space-between}.brand{color:#fff7dc;text-shadow:0 2px 10px #5d4766;font-size:16px;letter-spacing:2px}.altitude{color:#fff;text-align:right;font-family:system-ui,sans-serif}.altitude b{display:block;font-size:26px}.meters{height:6px;width:118px;background:#ffffff55;border-radius:9px;margin-top:7px;overflow:hidden}.meters i{display:block;height:100%;width:0;background:#ffcf55;border-radius:9px}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));text-align:center;pointer-events:auto}.card{background:#fff7dcf2;border:2px solid #fff;border-radius:24px;padding:26px 28px 22px;box-shadow:0 18px 50px #30263c66}.card h1{margin:0;font-size:clamp(38px,8vw,68px);line-height:.88;letter-spacing:-3px}.card h1 em{display:block;color:#ef7d46;font-style:italic}.card p{font-size:17px;line-height:1.45;margin:16px auto 18px;max-width:390px}.btn{border:0;border-radius:999px;background:#39304d;color:#fff7dc;padding:14px 24px;font-family:system-ui,sans-serif;font-weight:800;letter-spacing:1px;cursor:pointer;box-shadow:0 6px 0 #282238}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #282238}.hidden{display:none!important}.hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);color:#fff;text-align:center;text-shadow:0 2px 8px #4d3c5c;font-family:system-ui,sans-serif;font-weight:700;font-size:13px}.touch{position:absolute;bottom:20px;width:74px;height:74px;border-radius:50%;border:2px solid #fff7dcbb;background:#2f294077;color:white;font-size:28px;display:flex;align-items:center;justify-content:center;pointer-events:auto;opacity:0}@media(pointer:coarse){.touch{opacity:.72}.touch.left{left:18px}.touch.right{right:18px}}@media(max-width:600px){.top{top:12px;left:14px;right:14px}.brand{font-size:12px}.altitude b{font-size:20px}.card{padding:22px 18px}.hint{bottom:104px}}
</style></head><body>
<canvas id="c"></canvas>
<div class="ui">
 <div class="top"><div class="brand">ROPE TO THE SUN</div><div class="altitude"><b id="score">0 m</b><div class="meters"><i id="meter"></i></div></div></div>
 <div class="center" id="menu"><div class="card"><h1>Jump to <em>the sun</em></h1><p>Keep the rope turning. Jump through each sunset and climb into the sky.</p><button class="btn" id="start">START JUMPING</button></div></div>
 <div class="center hidden" id="gameover"><div class="card"><h1>One more <em>jump?</em></h1><p id="result">You climbed 0 meters.</p><button class="btn" id="again">TRY AGAIN</button></div></div>
 <div class="hint" id="hint">TAP / CLICK / SPACE TO JUMP</div>
 <button class="touch left" id="left">↶</button><button class="touch right" id="right">↷</button>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let W,H,DPR,playing=false,last=0,time=0,seed=19;let player,rope,clouds,stars,particles,score=0,speed=3.1,best=0,round=0;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);resize();
function rnd(){seed=(seed*9301+49297)%233280;return seed/233280}
function init(){seed=19+round*41;time=0;score=0;speed=3.1;player={x:W*.5,y:H*.72,vy:0,ground:H*.72,r:23,inv:0,lean:0};rope={angle:-Math.PI*.05,rot:0,rad:Math.min(W*.34,220),y:H*.72};clouds=[];for(let i=0;i<10;i++)clouds.push({x:rnd()*W,y:H*(.12+rnd()*.62),s:.5+rnd()*1.1,a:.12+rnd()*.22});stars=[];for(let i=0;i<65;i++)stars.push({x:rnd()*W,y:rnd()*H*.72,r:rnd()*1.4+.3,a:.2+rnd()*.7});particles=[]}
function burst(x,y,c,n){for(let i=0;i<n;i++)particles.push({x,y,vx:(rnd()-.5)*180,vy:-rnd()*130-30,life:.6+rnd()*.5,c,r:2+rnd()*4})}
function start(){round++;document.getElementById('menu').classList.add('hidden');document.getElementById('gameover').classList.add('hidden');document.getElementById('hint').classList.remove('hidden');init();playing=true}
document.getElementById('start').onclick=start;document.getElementById('again').onclick=start;
function jump(){if(!playing)return;if(player.y>=player.ground-4&&player.inv<=0){player.vy=-680-player.r*1.2;player.inv=.16;burst(player.x,player.y+20,'#fff4aa',7)}}
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'){e.preventDefault();jump()}if(e.code==='ArrowLeft'||e.key==='a')turn(-1);if(e.code==='ArrowRight'||e.key==='d')turn(1)});
function turn(d){if(player)player.x+=d*18}
canvas.addEventListener('pointerdown',jump);document.getElementById('left').onpointerdown=e=>{e.preventDefault();turn(-1)};document.getElementById('right').onpointerdown=e=>{e.preventDefault();turn(1)};
function collides(){const cx=player.x,cy=player.y+player.r*.3;const left=rope.x1,right=rope.x2;if(player.inv<=0&&cy>player.ground-75&&cy<player.ground+25&&cx>left-18&&cx<right+18&&Math.cos(rope.rot)>-.55&&player.y>player.ground-55)return true;return false}
function end(){playing=false;const reached=Math.floor(score);const isBest=reached>best;best=Math.max(best,reached);document.getElementById('result').textContent='You reached '+reached+' meters. '+(isBest?'A new personal best!':'Best: '+best+' m');document.getElementById('gameover').classList.remove('hidden')}
function drawSky(){let p=Math.min(1,score/500);let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,`rgb(${34-p*5},${37-p*4},${94-p*30})`);g.addColorStop(.55,`rgb(${130-p*35},${103-p*30},${138-p*35})`);g.addColorStop(1,'#f4a96d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);if(score>80)for(const s of stars){ctx.globalAlpha=s.a*(score>80?Math.min(1,(score-80)/180):0);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;const sunY=H*.19-Math.min(score,400)*.08;ctx.fillStyle='#ffe9a3';ctx.beginPath();ctx.arc(W*.78,Math.max(70,sunY),38,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffd66f';ctx.beginPath();ctx.arc(W*.78,Math.max(70,sunY),27,0,Math.PI*2);ctx.fill();}
function cloud(x,y,s,a){ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.globalAlpha=a;ctx.fillStyle='#fff2df';ctx.beginPath();ctx.ellipse(0,0,48,13,0,0,Math.PI*2);ctx.ellipse(-24,-7,24,18,0,0,Math.PI*2);ctx.ellipse(10,-11,31,22,0,0,Math.PI*2);ctx.ellipse(38,-3,22,14,0,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawRope(){rope.angle=time*speed*1.25;rope.x1=player.x-Math.cos(rope.angle)*rope.rad*.72;rope.x2=player.x+Math.cos(rope.angle)*rope.rad*.72;ctx.save();ctx.lineCap='round';ctx.strokeStyle='#3a3146';ctx.lineWidth=9;ctx.beginPath();ctx.moveTo(rope.x1,rope.y);ctx.quadraticCurveTo(player.x,rope.y+Math.sin(rope.angle)*90,rope.x2,rope.y);ctx.stroke();ctx.strokeStyle='#f1c268';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(rope.x1,rope.y);ctx.quadraticCurveTo(player.x,rope.y+Math.sin(rope.angle)*90,rope.x2,rope.y);ctx.stroke();ctx.restore()}
function drawWoman(){ctx.save();ctx.translate(player.x,player.y);ctx.rotate(player.lean);ctx.lineCap='round';ctx.strokeStyle='#5b3153';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-8,16);ctx.lineTo(-20,40);ctx.moveTo(8,16);ctx.lineTo(20,40);ctx.stroke();ctx.strokeStyle='#d9a35d';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(-15,1);ctx.lineTo(-30,20);ctx.moveTo(15,1);ctx.lineTo(30,18);ctx.stroke();ctx.fillStyle='#f18c76';ctx.beginPath();ctx.ellipse(0,5,18,25,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#eec3a2';ctx.beginPath();ctx.arc(0,-24,16,0,Math.PI*2);ctx.fill();ctx.fillStyle='#3b2d45';ctx.beginPath();ctx.arc(-2,-28,17,Math.PI*.92,Math.PI*1.95);ctx.lineTo(13,-17);ctx.quadraticCurveTo(-5,-33,-17,-15);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(6,-24,2,0,Math.PI*2);ctx.fill();ctx.restore()}
function update(dt){if(!playing)return;time+=dt;speed=3.1+Math.min(score/180,.9);player.inv-=dt;player.vy+=1700*dt;player.y+=player.vy*dt;if(player.y>player.ground){player.y=player.ground;player.vy=0}player.lean+=(Math.max(-.25,Math.min(.25,player.vy/900))-player.lean)*.12;rope.angle=time*speed*1.25;rope.x1=player.x-Math.cos(rope.angle)*rope.rad*.72;rope.x2=player.x+Math.cos(rope.angle)*rope.rad*.72;if(Math.sin(rope.angle)>-.12&&Math.sin(rope.angle)<.12&&player.y>player.ground-25&&player.y<player.ground+8){}score+=dt*(12+speed*3);document.getElementById('score').textContent=Math.floor(score)+' m';document.getElementById('meter').style.width=Math.min(100,score/5)+'%';if(Math.cos(rope.angle)>-.22&&Math.cos(rope.angle)<.22&&player.y>player.ground-50&&player.y<player.ground+8&&player.inv<=0)end();for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt}particles=particles.filter(p=>p.life>0)}
function render(){drawSky();for(const c of clouds){c.x-=.04*(speed);if(c.x<-80)c.x=W+80;cloud(c.x,c.y,c.s,c.a)}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;drawRope();drawWoman();}
function loop(now){let dt=Math.min(.033,(now-last)/1000||0);last=now;if(playing)update(dt);render();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
