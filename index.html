<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sparkle & Spa</title>
<style>
:root{--ink:#1d2857;--cream:#fffaf2;--pink:#ff82ad;--yellow:#ffd66b;--mint:#67dbc3;--blue:#82b9ff}
*{box-sizing:border-box}body{margin:0;font-family:ui-rounded,"Avenir Next",system-ui,sans-serif;color:var(--ink);overflow:hidden;background:#dff7f2}
.app{height:100dvh;display:grid;grid-template-columns:260px 1fr 250px;gap:14px;padding:14px;background:radial-gradient(circle at 50% 20%,#fff 0 8%,transparent 32%),linear-gradient(135deg,#dff8f1,#e7edff)}
.card{background:rgba(255,255,255,.91);border:3px solid #fff;border-radius:24px;box-shadow:0 12px 28px #66749b22}.left,.right{padding:16px}.brand{font-weight:1000;font-size:22px;letter-spacing:-1px;margin:4px 0 16px}.brand b{color:#ef668e}
.steps{display:grid;gap:8px}.step{border:0;border-radius:15px;background:#f3f5fb;color:#73799a;padding:10px 11px;text-align:left;font-weight:900;display:flex;align-items:center;gap:9px}.step.active{background:#fff0f5;color:var(--ink);box-shadow:inset 0 0 0 2px #ffc1d5}.step.done{background:#eafff7;color:#347d70}.num{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid #dde1ef}.step.active .num{background:var(--pink);color:white;border:0}.tip{margin-top:16px;border-radius:18px;background:#fff9d9;padding:12px;font-size:13px;line-height:1.35}
.scene{position:relative;overflow:hidden;display:grid;place-items:center}.sun{position:absolute;width:150px;height:150px;border-radius:50%;background:#fff4b7;right:-45px;top:-55px}.cloud{position:absolute;width:90px;height:26px;border-radius:30px;background:white;opacity:.85}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:white}.cloud:before{width:38px;height:38px;left:15px;bottom:8px}.cloud:after{width:48px;height:48px;right:8px;bottom:3px}.c1{left:8%;top:12%}.c2{right:10%;top:24%;transform:scale(.7)}
.stage{position:relative;width:min(430px,80%);height:80%;max-height:650px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:20px}.body{position:relative;width:210px;height:430px;z-index:2}.head{position:absolute;width:92px;height:108px;left:59px;top:0;border-radius:48% 48% 44% 44%;background:#ffc4a2;border:3px solid #f2a98a}.hair{position:absolute;width:104px;height:68px;left:-9px;top:-16px;border-radius:50px 50px 25px 25px;background:#594475;clip-path:polygon(0 0,100% 0,100% 70%,79% 55%,65% 100%,50% 58%,31% 100%,18% 55%,0 70%)}.face{position:absolute;left:19px;top:52px;width:50px;height:30px}.eye{position:absolute;width:7px;height:9px;background:#514354;border-radius:50%;top:0}.eye:last-child{right:0}.smile{position:absolute;width:22px;height:11px;border-bottom:3px solid #d66d78;border-radius:50%;left:14px;top:12px}
.torso{position:absolute;left:35px;top:96px;width:140px;height:178px;border-radius:55px 55px 42px 42px;background:#fff;box-shadow:inset 0 -18px 0 #ffb1c8}.arm{position:absolute;width:48px;height:205px;top:110px;border-radius:30px;background:#ffc4a2}.arm.left{left:-13px;transform:rotate(9deg)}.arm.right{right:-13px;transform:rotate(-9deg)}.leg{position:absolute;width:65px;height:170px;top:265px;border-radius:25px 25px 38px 38px;background:#ffc4a2}.leg.left{left:42px}.leg.right{right:42px}.zone{position:absolute;z-index:5;border:3px dashed rgba(255,255,255,.9);border-radius:50%;cursor:pointer;transition:.2s}.zone:hover,.zone.activeZone{background:rgba(255,217,94,.28);filter:drop-shadow(0 5px 12px #ffcf5e)}.zone.dirty:after{content:"";position:absolute;inset:-2px;border-radius:inherit;background:radial-gradient(circle at 30% 30%,#8bcfca 0 4%,transparent 5%),radial-gradient(circle at 65% 65%,#71bbb5 0 5%,transparent 6%),radial-gradient(circle at 55% 25%,#9edbd4 0 4%,transparent 5%)}
.z-upper{width:110px;height:90px;left:50px;top:135px}.z-middle{width:78px;height:72px;left:66px;top:215px}.z-back{width:92px;height:62px;left:59px;top:200px}.z-legs{width:132px;height:82px;left:39px;top:310px;border-radius:45px}.foam{position:absolute;border-radius:50%;background:#fff;box-shadow:10px 8px 0 #fff,-12px 10px 0 #efffff,5px -7px 0 #fff;opacity:0;pointer-events:none}.foam.show{opacity:1}
.floor{position:absolute;bottom:10px;width:390px;height:68px;border-radius:50%;background:#aee7de;z-index:0}.bubble{position:absolute;border-radius:50%;background:#fff;opacity:.75;pointer-events:none;animation:float 1s ease-out forwards}@keyframes float{to{transform:translateY(-80px) scale(.2);opacity:0}}
.right h2{margin:3px 0 4px}.progressWrap{height:12px;background:#edf0f7;border-radius:20px;overflow:hidden}.progress{height:100%;width:0;background:linear-gradient(90deg,var(--yellow),var(--pink));transition:.35s}.taskName{font-size:13px;color:#777fa0;margin:8px 0 14px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{border:2px solid #edf0f7;background:white;border-radius:15px;padding:10px 4px;font-size:12px;font-weight:900;cursor:pointer}.tool.active{border-color:#ffa0bf;background:#fff1f6}.tool span{display:block;font-size:24px;margin-bottom:3px}.cleanBtn{width:100%;border:0;border-radius:16px;background:var(--pink);color:white;font-weight:1000;padding:13px;margin-top:12px;box-shadow:0 7px 0 #dc658c}.cleanBtn:active{transform:translateY(4px);box-shadow:0 3px 0 #dc658c}
.score{display:flex;justify-content:space-between;margin:15px 0 8px;font-weight:900}.stars{letter-spacing:2px;color:#ffc84b}.win{position:absolute;z-index:20;inset:0;background:#effbf7d9;display:none;place-items:center;text-align:center}.win.show{display:grid}.winBox{background:white;border-radius:28px;padding:28px;width:min(330px,80%);box-shadow:0 20px 60px #6e7ea933}.winBox h1{margin:8px 0}.winBox button{border:0;border-radius:14px;background:var(--mint);color:#185f55;font-weight:1000;padding:12px 18px}
@media(max-width:850px){.app{grid-template-columns:1fr 170px;grid-template-rows:74px 1fr;padding:8px;gap:7px}.left{grid-column:1/-1;padding:8px 12px}.brand{display:inline-block;margin:4px 12px 0 0}.steps{display:flex}.step{flex:1;justify-content:center;padding:7px}.step span:last-child{display:none}.tip{display:none}.right{grid-column:2;padding:10px}.scene{grid-column:1}.stage{width:100%;height:92%;transform:scale(.82)}.tools{grid-template-columns:1fr}.tool{padding:5px}.tool span{display:inline;font-size:18px;margin-right:4px}.cleanBtn{margin-top:8px;padding:10px}.score{margin:8px 0}}
@media(max-width:520px){.app{grid-template-columns:1fr 145px}.stage{transform:scale(.72);width:140%;margin-left:-20%}.left{height:68px}.body{height:430px}.right h2{font-size:16px}.taskName{height:32px}}
</style></head>
<body>
<div class="app">
<aside class="left card"><div class="brand">Sparkle <b>& Spa</b></div><div class="steps">
<button class="step active" data-step="0"><span class="num">1</span><span>Fresh wash</span></button>
<button class="step" data-step="1"><span class="num">2</span><span>Gentle clean</span></button>
<button class="step" data-step="2"><span class="num">3</span><span>Soft rinse</span></button>
<button class="step" data-step="3"><span class="num">4</span><span>Dry & fluff</span></button></div><div class="tip">💡 Try the highlighted area, then choose a matching spa tool.</div></aside>
<main class="scene card"><div class="sun"></div><div class="cloud c1"></div><div class="cloud c2"></div><div class="floor"></div>
<div class="stage"><div class="body">
<div class="leg left"></div><div class="leg right"></div><div class="arm left"></div><div class="arm right"></div><div class="torso"></div>
<div class="head"><div class="hair"></div><div class="face"><i class="eye"></i><i class="eye"></i><i class="smile"></i></div></div>
<div class="zone z-upper activeZone dirty" data-zone="upper"></div><div class="zone z-middle dirty" data-zone="middle"></div><div class="zone z-back dirty" data-zone="back"></div><div class="zone z-legs dirty" data-zone="legs"></div>
<div class="foam" id="foam"></div></div></div>
<div class="win" id="win"><div class="winBox"><div style="font-size:52px">🛁</div><h1>Sparkling clean!</h1><p>Your spa guest feels fresh and relaxed.</p><div class="stars">★★★★★</div><br><button id="again">Play again</button></div></div></main>
<aside class="right card"><h2>Care kit</h2><div class="progressWrap"><div class="progress" id="progress"></div></div><div class="taskName" id="taskName">Wash · Upper area</div><div class="tools">
<button class="tool active" data-tool="soap"><span>🫧</span>Soap</button><button class="tool" data-tool="cloth"><span>🧽</span>Cloth</button><button class="tool" data-tool="rinse"><span>🚿</span>Rinse</button><button class="tool" data-tool="towel"><span>🧻</span>Towel</button></div>
<div class="score"><span>Cleanliness</span><span class="stars" id="stars">★★★☆☆</span></div><button class="cleanBtn" id="cleanBtn">Clean zone</button></aside></div>
<script>
const zones=[...document.querySelectorAll('.zone')],steps=[...document.querySelectorAll('.step')],tools=[...document.querySelectorAll('.tool')];
let stage=0,zoneIndex=0,score=0,tool='soap',cleaned=0;
const labels=[['Wash','Fresh wash'],['Lather','Gentle clean'],['Rinse','Soft rinse'],['Dry','Dry & fluff']], zoneNames=['Upper','Middle','Back','Leg'];
const completed=zones.map(()=>0);
function selectZone(i){zoneIndex=i;zones.forEach((z,n)=>z.classList.toggle('activeZone',n===i));updateTask()}
function setStage(n){stage=n;steps.forEach((s,i)=>{s.classList.toggle('active',i===n);s.classList.toggle('done',i<n)});tools.forEach(t=>t.classList.toggle('active',t.dataset.tool===['soap','cloth','rinse','towel'][n]));tool=['soap','cloth','rinse','towel'][n];updateTask()}
function bubbles(el){for(let i=0;i<10;i++){let b=document.createElement('i');b.className='bubble';const r=el.getBoundingClientRect(),x=Math.random()*r.width,y=Math.random()*r.height;b.style.cssText=`width:${8+Math.random()*14}px;height:${8+Math.random()*14}px;left:${x}px;top:${y}px`;el.appendChild(b);setTimeout(()=>b.remove(),1000)}}
function clean(){const z=zones[zoneIndex];if(completed[zoneIndex]===stage){selectZone((zoneIndex+1)%zones.length);return}completed[zoneIndex]=stage;z.classList.remove('dirty');bubbles(z);const foam=document.getElementById('foam');foam.className='foam show';foam.style.left=(zoneIndex===0?65:zoneIndex===1?68:zoneIndex===2?58:45)+'px';foam.style.top=(zoneIndex===0?150:zoneIndex===1?220:zoneIndex===2?205:300)+'px';setTimeout(()=>foam.className='foam',500);cleaned++;score=Math.min(100,Math.round((stage*4+cleaned)/16*100));document.getElementById('progress').style.width=score+'%';document.getElementById('stars').textContent='★'.repeat(Math.ceil(score/20))+'☆'.repeat(5-Math.ceil(score/20));if(cleaned>=4){cleaned=0;if(stage<3){setStage(stage+1);zones.forEach(x=>x.classList.add('dirty'));selectZone(0)}else{zones.forEach(x=>x.classList.remove('dirty'));document.getElementById('win').classList.add('show')}}else selectZone((zoneIndex+1)%zones.length)}
function updateTask(){document.getElementById('taskName').textContent=labels[stage][1]+' · '+zoneNames[zoneIndex]+' area'}
zones.forEach((z,i)=>z.onclick=()=>selectZone(i));tools.forEach(t=>t.onclick=()=>{tool=t.dataset.tool;tools.forEach(x=>x.classList.toggle('active',x===t));const n=['soap','cloth','rinse','towel'].indexOf(tool);if(n>=0)setStage(n)});document.getElementById('cleanBtn').onclick=clean;
steps.forEach(s=>s.onclick=()=>setStage(+s.dataset.step));document.getElementByById('again').onclick=()=>location.reload();
</script></body></html>
