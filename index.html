<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>KEYSTONE — Rhythm Session</title>
  <style>
    :root { --ink:#f8f5e9; --paper:#ebe6d5; --orange:#ff5c35; --blue:#4c63ff; --yellow:#ffd84d; --green:#57dc91; --line:#17171a; }
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden} body{font-family:Arial,Helvetica,sans-serif;background:#dcd7c7;color:var(--line);}
    #app{height:100%;display:grid;grid-template-rows:74px 1fr 154px;background:linear-gradient(135deg,#ddd8c8,#cfc7b3)}
    header{display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:3px solid var(--line);background:var(--paper);z-index:5}
    .brand{display:flex;align-items:center;gap:12px}.brand-mark{width:38px;height:38px;border:3px solid var(--line);border-radius:50%;display:grid;place-items:center;font-weight:1000;background:var(--yellow);box-shadow:3px 3px 0 var(--line)}
    .brand-name{font-weight:1000;font-size:20px;letter-spacing:3px}.brand-sub{font-size:10px;font-weight:800;letter-spacing:2px;opacity:.6;margin-top:2px}
    .top-actions{display:flex;gap:10px}.pill{height:38px;border:2px solid var(--line);border-radius:99px;background:#f7f3e5;padding:0 14px;font-weight:900;font-size:12px;cursor:pointer;box-shadow:2px 2px 0 var(--line)}
    main{position:relative;overflow:hidden}.stage{position:absolute;inset:0 180px 0 0;border-right:3px solid var(--line);background:linear-gradient(#eae5d3 0 62%,#d8d1bb 62%)}
    .track-grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr)}.lane{border-right:1px solid rgba(23,23,26,.12);position:relative}.lane:last-child{border-right:0}
    .judgeline{position:absolute;left:0;right:0;bottom:78px;height:3px;background:var(--line);z-index:3}.judgeline:before{content:'HIT';position:absolute;left:12px;top:-25px;font-size:9px;font-weight:1000;letter-spacing:2px}
    .hit-glow{position:absolute;left:0;right:0;height:70px;bottom:44px;background:linear-gradient(transparent,rgba(255,216,77,.22));opacity:0;z-index:2}.hit-glow.active{opacity:1}
    .note{position:absolute;width:58%;height:24px;left:21%;border:3px solid var(--line);border-radius:999px;box-shadow:3px 3px 0 rgba(23,23,26,.8);z-index:4}.note[data-lane="0"]{background:#ff7352}.note[data-lane="1"]{background:#ffd84d}.note[data-lane="2"]{background:#57dc91}.note[data-lane="3"]{background:#55cce5}.note[data-lane="4"]{background:#6f76ff}.note[data-lane="5"]{background:#ef78bd}
    .side{position:absolute;right:0;top:0;bottom:0;width:180px;padding:18px 14px;background:#cbc4af;border-left:0}.side-title{font-size:10px;font-weight:1000;letter-spacing:2px;margin-bottom:12px}.score-card{border:2px solid var(--line);background:var(--ink);box-shadow:4px 4px 0 var(--line);border-radius:8px;padding:12px;margin-bottom:14px}.score-label{font-size:9px;font-weight:900;letter-spacing:1.5px}.score-value{font-size:32px;font-weight:1000;line-height:1;margin-top:5px}.combo{font-size:11px;font-weight:900;margin-top:7px;color:#d64b2f}
    .meter-title{display:flex;justify-content:space-between;font-size:9px;font-weight:1000;letter-spacing:1px}.meter{height:12px;border:2px solid var(--line);border-radius:99px;margin-top:7px;overflow:hidden;background:#eee8d6}.meter-fill{height:100%;width:72%;background:var(--orange);transition:.2s}
    .song-card{position:absolute;bottom:18px;left:14px;right:14px;border-top:2px solid var(--line);padding-top:12px}.song-name{font-size:11px;font-weight:1000}.song-meta{font-size:9px;font-weight:800;opacity:.55;margin-top:4px}
    footer{display:grid;grid-template-columns:180px 1fr 180px;border-top:3px solid var(--line);background:#f2eddb;z-index:5}.instrument-panel{padding:16px;border-right:3px solid var(--line);display:flex;align-items:center}.instrument-visual{width:72px;height:72px;border:3px solid var(--line);border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:34px}.instrument-copy{margin-left:12px}.instrument-copy b{display:block;font-size:12px}.instrument-copy span{font-size:9px;font-weight:900;opacity:.55}
    .keys{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:18px 12px}.key{height:118px;border:3px solid var(--line);border-radius:10px;background:#fffdf3;box-shadow:4px 4px 0 var(--line);font-weight:1000;font-size:16px;cursor:pointer;position:relative;transition:.08s}.key:nth-child(1){background:#ff7352}.key:nth-child(2){background:#ffd84d}.key:nth-child(3){background:#57dc91}.key:nth-child(4){background:#55cce5}.key:nth-child(5){background:#6f76ff;color:white}.key:nth-child(6){background:#ef78bd}.key.active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}.key span{position:absolute;bottom:9px;left:0;right:0;text-align:center;font-size:10px;opacity:.65}
    .controls{border-left:3px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}.play-btn{width:70px;height:70px;border:3px solid var(--line);border-radius:50%;background:var(--orange);box-shadow:4px 4px 0 var(--line);font-size:25px;cursor:pointer}.play-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--line)}.controls small{font-weight:1000;letter-spacing:1px}
    #feedback{position:absolute;left:50%;top:35%;transform:translate(-50%,-50%);font-size:34px;font-weight:1000;letter-spacing:3px;opacity:0;z-index:20;text-shadow:3px 3px 0 var(--ink);transition:.12s}.show{opacity:1!important;transform:translate(-50%,-50%) scale(1.12)!important}
    @media(max-width:700px){#app{grid-template-rows:58px 1fr 128px}header{padding:0 12px}.brand-sub,.pill.secondary{display:none}.stage{right:112px}.side{width:112px;padding:10px 8px}.score-card{padding:8px}.score-value{font-size:22px}.song-card{display:none}.footer{grid-template-columns:0 1fr 82px}footer{grid-template-columns:0 1fr 82px}.instrument-panel{display:none}.keys{gap:4px;padding:12px 6px}.key{height:104px;font-size:13px}.key span{font-size:8px}.controls{border-left:2px solid var(--line)}.play-btn{width:58px;height:58px}.track-grid{grid-template-columns:repeat(6,1fr)}.note{width:72%;left:14%}}
  </style>
</head>
<body>
<div id="app">
  <header><div class="brand"><div class="brand-mark">K</div><div><div class="brand-name">KEYSTONE</div><div class="brand-sub">RHYTHM SESSION</div></div></div><div class="top-actions"><button class="pill secondary" id="instrumentBtn">◉ SYNTH</button><button class="pill" id="soundBtn">SOUND ON</button></div></header>
  <main><div class="stage" id="stage"><div class="track-grid"><div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div><div class="lane"></div></div><div class="hit-glow" id="glow"></div><div class="judgeline"></div><div id="feedback"></div></div><aside class="side"><div class="side-title">LIVE SCORE</div><div class="score-card"><div class="score-label">POINTS</div><div class="score-value" id="score">0000</div><div class="combo" id="combo">COMBO ×12</div></div><div class="meter-title"><span>ACCENT</span><span id="accuracy">72%</span></div><div class="meter"><div class="meter-fill" id="meter"></div></div><div class="song-card"><div class="song-name">NEON BLOOM</div><div class="song-meta">BEAT 01 · 96 BPM</div></div></aside></main>
  <footer><div class="instrument-panel"><div class="instrument-visual" id="instrumentVisual">⌇</div><div class="instrument-copy"><b id="instrumentName">SYNTH</b><span>CLASSIC</span></div></div><div class="keys" id="keys"><button class="key" data-lane="0">C<span>A</span></button><button class="key" data-lane="1">D<span>S</span></button><button class="key" data-lane="2">E<span>D</span></button><button class="key" data-lane="3">F<span>F</span></button><button class="key" data-lane="4">G<span>G</span></button><button class="key" data-lane="5">A<span>H</span></button></div><div class="controls"><button class="play-btn" id="play">▶</button><small id="status">PLAY</small></div></footer>
</div>
<script>
(() => {
const stage=document.getElementById('stage'), lanes=[...document.querySelectorAll('.lane')], keys=[...document.querySelectorAll('.key')];
let playing=false, score=0, combo=12, accuracy=72, notes=[], last=0, spawn=0, sound=true, instrument=0;
const instruments=[{name:'SYNTH',icon:'⌇',type:'triangle'}, {name:'PIANO',icon:'♫',type:'sine'}, {name:'BASS',icon:'≋',type:'sawtooth'}, {name:'ORGAN',icon:'▥',type:'square'}];
let audioCtx;
const freqs=[261.63,293.66,329.63,349.23,392,440];
function initAudio(){if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended')audioCtx.resume()}
function playTone(lane){if(!sound)return;initAudio();const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type=instruments[instrument].type;o.frequency.value=freqs[lane];g.gain.setValueAtTime(.12,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.28);o.connect(g).connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.29)}
function makeNote(lane){const n=document.createElement('div');n.className='note';n.dataset.lane=lane;n.dataset.y=-30;n.style.top='-30px';stage.appendChild(n);notes.push(n)}
function updateNotePositions(dt){const h=stage.clientHeight, line=h-78, speed=Math.max(150,h*.31);spawn+=dt;if(spawn>620){spawn=0;makeNote(Math.floor(Math.random()*6))}for(let i=notes.length-1;i>=0;i--){const n=notes[i];let y=(Number(n.dataset.y)||-30)+speed*dt/1000;n.dataset.y=y;n.style.top=y+'px';if(y>h+30){n.remove();notes.splice(i,1);combo=0;accuracy=Math.max(20,accuracy-3);updateStats();}}}
function hit(lane){if(!playing){togglePlay()}initAudio();playTone(lane);keys[lane].classList.add('active');setTimeout(()=>keys[lane].classList.remove('active'),90);document.getElementById('glow').classList.add('active');setTimeout(()=>document.getElementById('glow').classList.remove('active'),110);
 const line=stage.clientHeight-78;let best=null,bestD=999;notes.forEach(n=>{if(Number(n.dataset.lane)===lane){const d=Math.abs(Number(n.dataset.y)-line);if(d<bestD){bestD=d;best=n}}});let label='MISS',bonus=0;if(best&&bestD<48){label=bestD<18?'PERFECT':bestD<32?'GOOD':'LATE';bonus=label==='PERFECT'?100:label==='GOOD'?70:40;best.remove();notes.splice(notes.indexOf(best),1);combo++;score+=bonus+combo*5;accuracy=Math.min(100,accuracy+(label==='PERFECT'?4:2));}else{combo=0;accuracy=Math.max(20,accuracy-5)}feedback(label);updateStats()}
function feedback(t){const f=document.getElementById('feedback');f.textContent=t;f.style.color=t==='MISS'? '#d64b2f':'#17171a';f.classList.add('show');clearTimeout(f.timer);f.timer=setTimeout(()=>f.classList.remove('show'),400)}
function updateStats(){document.getElementById('score').textContent=String(score).padStart(4,'0');document.getElementById('combo').textContent='COMBO ×'+combo;document.getElementById('accuracy').textContent=accuracy+'%';document.getElementById('meter').style.width=accuracy+'%'}
function togglePlay(){playing=!playing;document.getElementById('play').textContent=playing?'Ⅱ':'▶';document.getElementById('status').textContent=playing?'LIVE':'PLAY';if(playing){last=performance.now();feedback('GO!')}}
document.getElementById('play').addEventListener('click',togglePlay);keys.forEach(k=>k.addEventListener('pointerdown',e=>{e.preventDefault();hit(Number(k.dataset.lane))}));
window.addEventListener('keydown',e=>{const map={a:0,s:1,d:2,f:3,g:4,h:5};if(map[e.key.toLowerCase()]!==undefined&&!e.repeat)hit(map[e.key.toLowerCase()]);if(e.code==='Space'&&!e.repeat){e.preventDefault();togglePlay()}});
document.getElementById('soundBtn').addEventListener('click',e=>{sound=!sound;e.target.textContent=sound?'SOUND ON':'SOUND OFF'});
document.getElementById('instrumentBtn').addEventListener('click',()=>{instrument=(instrument+1)%instruments.length;const x=instruments[instrument];document.getElementById('instrumentName').textContent=x.name;document.getElementById('instrumentVisual').textContent=x.icon;document.getElementById('instrumentBtn').textContent='◉ '+x.name});
function loop(now){const dt=playing?Math.min(32,now-last):0;last=now;if(playing)updateNotePositions(dt);requestAnimationFrame(loop)}requestAnimationFrame(loop);updateStats();
})();
</script>
</body>
</html>
