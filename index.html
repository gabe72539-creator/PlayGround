<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Squish Studio</title>
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#17152b;color:#fff;font-family:Trebuchet MS,system-ui,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}.game{position:relative;width:100vw;height:100vh;min-height:500px;background:linear-gradient(145deg,#24213e,#17162c 65%,#30264b)}.sun{position:absolute;width:520px;height:520px;border-radius:50%;background:rgba(255,126,196,.09);filter:blur(2px);left:calc(50% - 260px);top:-260px}.top{position:absolute;z-index:5;left:0;right:0;top:0;padding:18px clamp(16px,4vw,42px);display:flex;justify-content:space-between;align-items:flex-start}.brand{font-weight:900;font-size:15px;letter-spacing:3px;color:#ffb8d9}.brand b{display:block;font-size:28px;letter-spacing:-1px;color:#fff}.stats{display:flex;gap:10px}.pill{min-width:92px;text-align:center;padding:9px 12px;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.07);backdrop-filter:blur(10px)}.pill small{display:block;color:#aaa4be;font-size:9px;text-transform:uppercase;letter-spacing:2px}.pill strong{font-size:20px}.stage{position:absolute;inset:84px 0 0;display:flex;align-items:center;justify-content:center}.halo{position:absolute;width:min(70vw,560px);height:min(70vw,560px);border-radius:50%;border:1px solid rgba(255,255,255,.06);box-shadow:0 0 90px rgba(255,126,196,.08)}.character{position:absolute;width:min(54vw,420px);height:min(58vw,490px);bottom:3vh;filter:drop-shadow(0 24px 24px rgba(0,0,0,.28));transform-origin:50% 80%}.hair{position:absolute;width:54%;height:50%;left:23%;top:-1%;border-radius:55% 55% 38% 38%;background:#5e3548;clip-path:polygon(12% 5%,88% 5%,100% 70%,84% 100%,70% 78%,58% 100%,43% 78%,29% 100%,15% 72%,0 70%);z-index:1}.head{position:absolute;width:29%;height:24%;left:35.5%;top:11%;border-radius:48% 48% 44% 44%;background:#e7a98d;z-index:2}.head:before,.head:after{content:"";position:absolute;width:13%;height:13%;border-radius:50%;top:48%;background:#3a2940}.head:before{left:23%}.head:after{right:23%}.hair-top{position:absolute;width:31%;height:11%;left:34.5%;top:8.5%;border-radius:70% 70% 30% 20%;background:#6d4052;z-index:3}.body{position:absolute;width:56%;height:43%;left:22%;bottom:2%;z-index:2}.shirt{position:absolute;width:76%;height:43%;left:12%;top:0;border-radius:48% 48% 14% 14%;background:linear-gradient(135deg,#ff9fc5,#ed6fa5);border:2px solid rgba(255,255,255,.15);z-index:3}.shorts{position:absolute;width:100%;height:52%;left:0;bottom:-2%;border-radius:32% 32% 44% 44%;background:#7773aa;z-index:4}.backdrop{position:absolute;width:74%;height:35%;left:13%;bottom:6%;border-radius:46%;background:#57456a;opacity:.9}.cushion-wrap{position:absolute;width:68%;height:36%;left:16%;bottom:4%;z-index:7}.cushion{position:absolute;width:66%;height:76%;bottom:0;border-radius:48% 48% 42% 42%;background:linear-gradient(145deg,#ed8bb5,#c76096);box-shadow:inset -12px -8px 20px rgba(110,45,82,.16),inset 10px 8px 18px rgba(255,212,230,.18),0 12px 20px rgba(0,0,0,.18);transition:transform .09s cubic-bezier(.2,.8,.2,1);cursor:pointer}.cushion.left{left:0;transform-origin:100% 70%;border-radius:55% 42% 44% 48%}.cushion.right{right:0;transform-origin:0 70%;border-radius:42% 55% 48% 44%}.cushion.pressed.left{transform:scale(.78,.58) translate(8%,8%)}.cushion.pressed.right{transform:scale(.78,.58) translate(-8%,8%)}.cushion-inner{position:absolute;width:62%;height:58%;left:19%;bottom:12%;border-radius:50%;border:1px solid rgba(255,255,255,.12)}.hands{position:absolute;z-index:10;width:44%;height:20%;left:28%;bottom:-2%;pointer-events:none}.hand{position:absolute;width:48%;height:78%;bottom:-10%;border-radius:48%;background:#e7a98d;opacity:0;transition:opacity .12s,transform .12s}.hand.left{left:2%;transform:rotate(-12deg)}.hand.right{right:2%;transform:rotate(12deg)}.character.show-hands .hand{opacity:1;transform:translateY(-32px) scale(.92)}.floor{position:absolute;width:80%;height:30%;left:10%;bottom:-12%;border-radius:50%;background:rgba(255,255,255,.035)}.combo{position:absolute;z-index:6;left:50%;top:64%;transform:translate(-50%,-50%) scale(.8);font-size:52px;font-weight:1000;font-style:italic;text-shadow:0 8px 24px #17152b;color:#ffd7ea;opacity:0;transition:.18s}.combo.pop{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(-4deg)}.meterbox{position:absolute;z-index:8;left:50%;bottom:22px;transform:translateX(-50%);width:min(500px,70vw)}.meterlabel{display:flex;justify-content:space-between;margin-bottom:6px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#aaa4be}.meter{height:10px;border-radius:20px;background:rgba(255,255,255,.09);overflow:hidden}.fill{height:100%;width:0;border-radius:20px;background:linear-gradient(90deg,#ff74b2,#ffd06a);transition:width .15s}.button{position:absolute;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%);padding:16px 30px;border:0;border-radius:999px;background:#fff;color:#30243f;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 12px 40px rgba(0,0,0,.28)}.hidden{display:none}.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#ffd7ea;z-index:30;pointer-events:none;animation:spark .55s ease-out forwards}@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}@media(max-height:650px){.character{height:min(60vh,430px);width:min(50vw,360px)}.stage{inset:72px 0 0}.top{padding-top:12px}.meterbox{bottom:10px}.combo{top:58%}}@media(max-width:520px){.top{padding:12px 12px}.brand b{font-size:21px}.brand{font-size:11px}.stats{gap:5px}.pill{min-width:72px;padding:7px 8px}.pill strong{font-size:17px}.character{width:78vw;height:60vh;max-height:430px}.meterbox{width:82vw}.halo{width:92vw;height:92vw}}
.result{position:absolute;z-index:25;left:50%;top:50%;transform:translate(-50%,-50%);width:min(380px,84vw);padding:28px;border:1px solid rgba(255,255,255,.14);border-radius:28px;background:rgba(35,30,62,.94);backdrop-filter:blur(16px);text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.38)}.result.hidden{display:none}.result small{color:#ffb8d9;letter-spacing:3px;font-weight:900}.result h2{margin:8px 0;font-size:38px}.result p{margin:0 0 18px;color:#c8c2d8}.result button{border:0;border-radius:999px;padding:13px 22px;background:#fff;color:#30243f;font-weight:900;cursor:pointer}.combo-reset{animation:shake .2s}@keyframes shake{50%{transform:translate(-50%,-50%) scale(.96)}}
</style></head>
<body><div class="game"><div class="sun"></div><div class="top"><div class="brand">SQUISH<b>STUDIO</b></div><div class="stats"><div class="pill"><small>Time</small><strong id="time">30</strong></div><div class="pill"><small>Score</small><strong id="score">0</strong></div><div class="pill"><small>Combo</small><strong id="combo">x1</strong></div></div></div><div class="result hidden" id="result"><small>FINAL SCORE</small><h2 id="finalScore">0</h2><p id="bestText">Beat your best!</p><button id="again">PLAY AGAIN</button></div><div class="stage"><div class="halo"></div><div class="floor"></div><div class="character" id="character"><div class="backdrop"></div><div class="hair"></div><div class="head"></div><div class="hair-top"></div><div class="body"><div class="shirt"></div><div class="shorts"></div></div><div class="cushion-wrap"><div class="cushion left" data-side="left"><div class="cushion-inner"></div></div><div class="cushion right" data-side="right"><div class="cushion-inner"></div></div></div><div class="hands"><div class="hand left"></div><div class="hand right"></div></div></div><div class="combo" id="comboText">SQUISH!</div></div><div class="meterbox"><div class="meterlabel"><span>Squish meter</span><span id="percent">0%</span></div><div class="meter"><div class="fill" id="fill"></div></div></div><button class="button" id="start">START SQUISHING</button></div>
<script>
const scoreEl=document.getElementById('score'),comboEl=document.getElementById('combo'),comboText=document.getElementById('comboText'),fill=document.getElementById('fill'),percent=document.getElementById('percent'),character=document.getElementById('character'),start=document.getElementById('start'),timeEl=document.getElementById('time'),result=document.getElementById('result'),finalScore=document.getElementById('finalScore'),bestText=document.getElementById('bestText'),again=document.getElementById('again');let score=0,combo=1,active=false,meter=0,timeout,clock,seconds=30,lastHit=0;
function addSpark(el,x,y){for(let i=0;i<10;i++){const s=document.createElement('i');s.className='spark';s.style.left=x+'px';s.style.top=y+'px';const a=Math.PI*2*i/10,r=30+Math.random()*45;s.style.setProperty('--dx',Math.cos(a)*r+'px');s.style.setProperty('--dy',Math.sin(a)*r+'px');el.appendChild(s);setTimeout(()=>s.remove(),600)}}
function updateMeters(){scoreEl.textContent=score.toLocaleString();comboEl.textContent='x'+combo;fill.style.width=meter+'%';percent.textContent=Math.round(meter)+'%'}
function squish(e){if(!active)return;e.preventEvent?.();const el=e.currentTarget,now=Date.now();combo=now-lastHit<650?Math.min(combo+1,99):1;lastHit=now;el.classList.add('pressed');character.classList.add('show-hands');clearTimeout(timeout);timeout=setTimeout(()=>{el.classList.remove('pressed');character.classList.remove('show-hands')},150);score+=10*combo;meter=Math.min(100,meter+9);updateMeters();comboText.textContent=['SQUISH!','SOFT!','NICE!','BOING!','YEAH!','POP!'][Math.floor(Math.random()*6)];comboText.classList.remove('pop');void comboText.offsetWidth;comboText.classList.add('pop');setTimeout(()=>comboText.classList.remove('pop'),280);const rect=el.getBoundingClientRect();addSpark(document.querySelector('.game'),e.clientX||rect.left+rect.width/2,e.clientY||rect.top+rect.height/2)}
document.querySelectorAll('.cushion').forEach(c=>{c.addEventListener('pointerdown',e=>{e.preventDefault();squish(e)},{passive:false});c.addEventListener('contextmenu',e=>e.preventDefault())});
setInterval(()=>{if(active&&meter>0){meter=Math.max(0,meter-.25);if(Date.now()-lastHit>900&&combo>1)combo=1;updateMeters()}},120);
function endGame(){active=false;clearInterval(clock);meter=0;updateMeters();finalScore.textContent=score.toLocaleString();const best=Number(localStorage.getItem('squishBest')||0);if(score>best)localStorage.setItem('squishBest',score);bestText.textContent=score>=best&&score>0?'New personal best!':`Personal best: ${Math.max(best,score).toLocaleString()}`;result.classList.remove('hidden')}
function begin(){active=true;score=0;combo=1;meter=0;seconds=30;lastHit=0;scoreEl.textContent='0';comboEl.textContent='x1';timeEl.textContent='30';fill.style.width='0';percent.textContent='0%';start.classList.add('hidden');result.classList.add('hidden');clearInterval(clock);clock=setInterval(()=>{seconds--;timeEl.textContent=seconds;if(seconds<=0)endGame()},1000)}
start.addEventListener('click',begin);again.addEventListener('click',begin);
</script></body></html>
