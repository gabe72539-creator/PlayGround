<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Brawl Stars</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#6d8a48;font-family:Trebuchet MS,Arial,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;color:white;text-shadow:0 3px 0 #4b4b55,0 0 4px #000}
#top{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;font-weight:900;font-size:20px}.team{border-radius:12px;padding:8px 14px;background:#2a5de8}.team.red{background:#cf3a42}.vs{font-size:15px;color:#ffe26a;text-shadow:0 2px #4b3b20}
#timer{position:absolute;top:15px;right:16px;font-size:24px;font-weight:900;color:#fff}
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(27,29,35,.38);z-index:5}.card{width:min(420px,calc(100% - 32px));border-radius:24px;padding:26px 22px;text-align:center;background:linear-gradient(145deg,#ffd44a,#f59b22);border:6px solid #fff29a;box-shadow:0 12px 0 #9d641d,0 20px 40px #0008}.card h1{margin:0 0 4px;font-size:44px;color:#fff;letter-spacing:-2px;text-shadow:0 5px #ba681c}.card p{margin:8px 0 18px;font-weight:800;color:#71420f}.card button{border:0;border-radius:14px;background:#4e9f31;color:#fff;font-size:22px;font-weight:900;padding:14px 28px;box-shadow:0 7px 0 #2d6d20;cursor:pointer}.card button:active{transform:translateY(5px);box-shadow:0 2px 0 #2d6d20}
#stick{position:absolute;left:20px;bottom:max(22px,env(safe-area-inset-bottom));width:125px;height:125px;border:4px solid #ffffff55;border-radius:50%;background:#ffffff18;pointer-events:none;display:none}#knob{position:absolute;width:58px;height:58px;border-radius:50%;left:34px;top:34px;background:#ffffff88;border:3px solid #fff;box-shadow:0 4px 12px #0005}#attack{position:absolute;right:max(24px,env(safe-area-inset-right));bottom:max(28px,env(safe-area-inset-bottom));width:112px;height:112px;border-radius:50%;border:5px solid #fff8;background:#f3bd36cc;color:#fff;font-size:25px;font-weight:900;pointer-events:none;display:none;text-shadow:0 3px #6e5317;box-shadow:0 8px 18px #0005}
@media(pointer:coarse){#stick,#attack{display:block}}
</style></head>
<body>
<canvas id="c"></canvas><div id="hud"><div id="top"><div class="team" id="blueScore">BLUE 0</div><div class="vs">★ GEM GRAB</div><div class="team red" id="redScore">RED 0</div></div><div id="timer">1:30</div></div>
<div id="stick"><div id="knob"></div></div><button id="attack">ATK</button>
<div id="menu"><div class="card"><h1>GEM GRAB</h1><p>Collect 10 gems • Beat the red team</p><button id="play">PLAY</button></div></div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H,scale=1;
function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;scale=devicePixelRatio;x.setTransform(1,0,0,1,0,0)}addEventListener('resize',resize);resize();
const rnd=(a,b)=>a+Math.random*(b-a);const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let state='menu',keys={},p,gem=[],bots=[],bullets=[],particles=[],shake=0,time=90,accum=0,last=performance.now();
function reset(){p={x:W/2,y:H*.75,r:18*scale,team:'blue',hp:100,max:100,gems:0,inv:0,face:0,cd:0,speed:250*scale};bots=[];for(let i=0;i<5;i++)bots.push({x:(W*(.2+.15*i)),y:H*.25+(i%2)*50*scale,r:17*scale,hp:100,max:100,gems:i===0?2:0,team:i<2?'blue':'red',cd:rnd(0,1),inv:0,face:0,speed:150*scale,dead:0,respawn:0});gem=[];for(let i=0;i<7;i)gem.push(spawnGem());bullets=[];particles=[];time=90;state='playing'}
function spawnGem(){return{x:W/2+rnd(-220,220)*scale,y:H/2+rnd(-170,170)*scale,r:8*scale,spin:rnd(0,6)}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
const walls=[{x:.05,y:.36,w:.16,h:.28},{x:.79,y:.36,w:.16,h:.28},{x:.42,y:.22,w:.16,h:.12},{x:.42,y:.66,w:.16,h:.12}];
function wallHit(o,nx,ny){for(const w of walls){let wx=w.x*W,wy=w.y*H,ww=w.w*W,wh=w.h*H;if(nx+w.r>wx&&nx-w.r<wx+ww&&ny+w.r>wy&&ny-w.r<wy+wh){return true}}return false}
function shoot(a,dx,dy,enemy){if(a.cd>0)return;a.cd=.38;const l=Math.hypot(dx,dy)||1;bullets.push({x:a.x+dx/l*25*scale,y:a.y+dy/l*25*scale,vx:dx/l*520*scale,vy:dy/l*520*scale,r:6*scale,team:a.team,life:1.1});a.face=Math.atan2(dy,dx)}
addEventListener('keydown',e=>keys[e.key.toLower])
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let aim={x:0,y:0},stick=false,sx=0,sy=0;
c.addEventListener('pointerdown',e=>{if(state!='playing')return;if(e.clientX*scale<W*.45){stick=true;sx=e.clientX*scale;sy=e.clientY*scale}else aimPointer(e)});
addEventListener('pointermove',e=>{if(stick)aimStick(e);else if(e.buttons) aimPointer(e)});addEventListener('pointerup',()=>stick=false);
function aimStick(e){const dx=e.clientX*scale-sx,dy=e.clientY*scale-sy,l=Math.hypot(dx,dy)||1;const k=Math.min(38*scale,l);document.getElementById('knob').style.transform=`translate(${dx/l*k/scale}px,${dy/l*k/scale}px)`;aim={x:dx/l,y:dy/l}}
document.getElementById('attack').addEventListener('pointerdown',e=>{e.preventDefault();aim={x:1,y:0};shoot(p,1,0,false)});
function aimPointer(e){const dx=e.clientX*scale-p.x,dy=e.clientY*scale-p.y;shoot(p,dx,dy,true)}
function update(dt){if(state!='playing')return;accum+=dt;if(accum>.25){accum=0;time-=.25}if(time<=0)endMatch();p.cd-=dt;p.inv-=dt;
let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+aim.x,my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+aim.y,l=Math.hypot(mx,my)||1;if(l>1){mx/=l;my/=l}if(!stick&&Math.abs(mx+my)<.001&&l<=1){mx=keys.d||0-my}let nx=p.x+mx*p.speed*dt,ny=p.y+my*p.speed*dt;if(!wallHit(p,nx,p.y))p.x=nx;if(!wallHit(p,p.x,ny))p.y=ny;p.x=clamp(p.x,p.r,W-p.r);p.y=clamp(p.y,p.r,H-p.r);
for(let i=gem.length-1;i>=0;i--){if(dist(p,gem[i])<p.r+gem[i].r){p.gems++;gem.splice(i,1)}}
for(const b of bots){if(b.dead>0){b.respawn-=dt;if(b.respawn<=0){b.dead=0;b.hp=b.max;b.gems=b.team=='blue'?0:0;b.x=rnd(.15,.85)*W;b.y=rnd(.12,.35)*H}continue}b.inv-=dt;b.cd-=dt;
let target=b.team=='red'?p:null;if(b.team=='blue')target=bots.find(q=>q.team=='red'&&q.dead<=0&&dist(q,b)<260*scale)||p;if(!target||target.dead>0)continue;if(b.team=='red'||b.team=='blue'){}
let dx=(b.team=='red'?p.x:b.team=='blue'?findEnemy(b).x:p.x)-b.x,dy=(b.team=='red'?p.y:b.team=='blue'?findEnemy(b).y:p.y)-b.y,d=Math.hypot(dx,dy);if(d<240*scale&&b.cd<=0)shoot(b,dx,dy,false);let move=b.team=='red'?1:-1;if(d>150*scale&&b.team=='red'||d<100*scale&&b.team=='blue'){move=b.team=='red'?1:-1}else move=0;let nx=b.x+(dx/d)*b.speed*move*dt,ny=b.y+(dy/d)*b.speed*move*dt;if(!wallHit(b,nx,b.y))b.x=clamp(nx,b.r,W-b.r);if(!wallHit(b,b.x,ny))b.y=clamp(ny,b.r,H-b.r);
if(dist(b,p)<b.r+p.r&&b.team=='red'&&p.inv<=0){hurt(p,8,b)}}
for(let i=bullets.length-1;i>=0;i--){const z=bullets[i];z.x+=z.vx*dt;z.y+=z.vy*dt;z.life-=dt;if(z.life<=0||z.x<0||z.x>W||z.y<0||z.y>H||wallHit(z,z.x,z.y)){bullets.splice(i,1);continue}let arr=z.team=='blue'?bots.concat([p]):bots;for(const o of arr){if(o===p&&z.team=='blue'||o.team===z.team||o.dead>0)continue;if(dist(z,o)<z.r+o.r){hurt(o,20,z);bullets.splice(i,1);break}}}
for(let i=particles.length-1;i>=0;i--){let q=particles[i];q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt;if(q.life<=0)particles.splice(i,1)}if(gem.length<7&&Math.random()<.008)gem.push(spawnGem());let bs=0,rs=0;for(const b of bots){if(b.team=='blue')bs+=b.gems;else rs+=b.gems}bs+=p.gems;if(bs>=10||rs>=10)endMatch();blueScore.textContent='BLUE '+bs;redScore.textContent='RED '+rs}
function findEnemy(b){let best=p;let bd=b.team=='blue'?dist(b,p):999;if(b.team=='blue')for(const q of bots)if(q.team=='red'&&q.dead<=0&&dist(b,q)<bd){bd=dist(b,q);best=q}return best}
function hurt(o,n,from){if(o.inv>0)return;o.hp-=n;o.inv=.25;shake=5*scale;for(let i=0;i<7;i++)particles.push({x:o.x,y:o.y,vx:rnd(-120,120)*scale,vy:rnd(-120,120)*scale,life:rnd(.3,.6),r:rnd(3,7)*scale,color:o.team=='red'?'#ff4a54':'#5a79ff'});if(o.hp<=0){if(o.gems){gem.push(...Array(Math.min(o.gems,5)).fill(0).map(()=>({x:o.x+rnd(-35,35)*scale,y:o.y+rnd(-35,35)*scale,r:8*scale,spin:0})))}o.gems=0;if(o===p){p.hp=p.max;p.gems=0;p.x=W/2;p.y=H*.75;p.inv=2}else{o.dead=1;o.respawn=3;o.gems=0}}}
function endMatch(){state='menu';document.querySelector('.card h1').textContent='MATCH OVER';document.querySelector('.card p').textContent=document.getElementById('blueScore').textContent+'  —  '+document.getElementById('redScore').textContent;document.getElementById('play').textContent='REMATCH';document.getElementById('menu').style.display='flex'}
function draw(){x.setTransform(scale,0,0,scale,0,0);const WW=W/scale,HH=H/scale;x.save();if(shake){x.translate(rnd(-shake,shake)/scale,rnd(-shake,shake)/scale);shake*=.85}x.fillStyle='#74a34f';x.fillRect(0,0,WW,HH);
x.fillStyle='#638c43';for(let iy=0;iy<HH;iy+=32*scale)for(let ix=0;ix<WW;ix+=32*scale)if((ix/32+iy/32)%2===0)x.fillRect(ix/scale,iy/scale,32,32);
x.strokeStyle='#91b967';x.lineWidth=3;for(let i=0;i<WW;i+=80){x.beginPath();x.moveTo(i,0);x.lineTo(i,HH);x.stroke()}for(let i=0;i<HH;i+=80){x.beginPath();x.moveTo(0,i);x.lineTo(WW,i);x.stroke()}
for(const w of walls){const wx=w.x*WW,wy=w.y*HH,ww=w.w*WW,wh=w.h*HH;x.fillStyle='#ab7f56';round(wx,wy,ww,wh,8);x.fill();x.fillStyle='#cda47a';round(wx+5,wy+5,ww-10,10,4);x.fill();x.fillStyle='#76543c';for(let i=wx+18;i<wx+ww;i+=30)x.fillRect(i,wy+wh*.55,12,wh*.35)}
for(const g of gem){x.save();x.translate(g.x/scale,g.y/scale);x.rotate(Math.sin(performance.now()/300+g.spin)*.15);x.fillStyle='#e75bd1';x.beginPath();x.moveTo(0,-10);x.lineTo(7,-3);x.lineTo(5,7);x.lineTo(-5,7);x.lineTo(-7,-3);x.closePath();x.fill();x.strokeStyle='#ffb0fa';x.lineWidth=2;x.stroke();x.restore()}
for(const z of bullets){x.fillStyle=z.team=='blue'?'#70adff':'#ffdc55';x.beginPath();x.arc(z.x/scale,z.y/scale,z.r/scale,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=2;x.stroke()} 
function fighter(o){if(o.dead>0)return;x.save();x.translate(o.x/scale,o.y/scale);x.rotate(o.face||0);x.fillStyle='#0004';x.beginPath();x.ellipse(0,16,21,8,0,0,7);x.fill();x.fillStyle=o.team=='red'?'#ec5a55':'#4f82dd';x.beginPath();x.arc(0,0,o.r/scale,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();x.fillStyle='#f3c18b';x.beginPath();x.arc(5,-3,8,0,7);x.fill();x.fillStyle='#2d2d36';x.fillRect(11,-7,12,5);x.fillStyle='#222';x.beginPath();x.arc(-5,-5,2,0,7);x.fill();x.restore();if(o.hp<o.max){x.fillStyle='#333';x.fillRect(o.x/scale-22,o.y/scale-32,44,7);x.fillStyle=o.team=='red'?'#ff4a50':'#55d56b';x.fillRect(o.x/scale-22,o.y/scale-32,44*(o.hp/o.max),7)}if(o.gems)x.fillText('◆ '+o.gems,o.x/scale-12,o.y/scale+34)}
for(const b of bots)fighter(b);fighter(p);
for(const q of particles){x.globalAlpha=Math.max(0,q.life*2);x.fillStyle=q.color;x.beginPath();x.arc(q.x/scale,q.y/scale,q.r/scale,0,7);x.fill()}x.globalAlpha=1;x.restore();requestAnimationFrame(loop)}
function round(a,b,c,d,r){x.beginPath();x.roundRect(a,b,c,d,r)}
function loop(t){let dt=Math.min(.033,(t-last)/1000);last=t;update(dt);draw()}document.getElementById('play').onclick=()=>{document.getElementById('menu').style.display='none';reset()};reset();state='menu';loop(performance.now());
</script></body></html>
