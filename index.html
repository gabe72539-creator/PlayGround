<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>99 Nights in the Forest</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#09130d;font-family:Trebuchet MS,Arial,sans-serif;color:#f7f0d7;user-select:none}canvas{display:block;width:100%;height:100%}.ui{position:absolute;inset:0;pointer-events:none}.topbar{position:absolute;top:16px;left:50%;transform:translateX(-50%);display:flex;gap:8px}.panel{background:rgba(10,24,16,.88);border:2px solid rgba(221,196,133,.28);border-radius:14px;box-shadow:0 7px 22px #0008}.night{padding:9px 16px;font-weight:900;text-align:center;min-width:115px}.night small{display:block;color:#dfcfa7;font-size:10px;letter-spacing:2px}.night b{font-size:20px}.timer{padding:8px 14px;color:#e8dba9;font-weight:bold}.resources{position:absolute;left:18px;top:18px;padding:10px 12px;display:flex;gap:12px}.res{min-width:54px}.res span{display:block;font-size:10px;color:#bcd1b7}.res b{font-size:18px}.minimap{position:absolute;right:18px;top:18px;width:145px;height:145px;border-radius:50%;overflow:hidden;border:3px solid rgba(221,196,133,.35)}.minimap canvas{width:100%;height:100%}.vignette{position:absolute;inset:0;box-shadow:inset 0 0 120px 30px rgba(0,0,0,.38);z-index:-1}.quest{position:absolute;left:18px;top:92px;width:210px;padding:13px}.quest h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:2px;color:#d2bd80}.quest p{margin:5px 0;font-size:13px;color:#dfebd7}.quest .bar{height:6px;border-radius:4px;background:#1a2c20;overflow:hidden;margin-top:8px}.quest .fill{height:100%;width:40%;background:#d7a95c}.health{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);width:min(330px,45vw);padding:9px 12px}.health label{display:flex;justify-content:space-between;font-size:11px;color:#d9c99f;margin-bottom:5px}.hpbg{height:10px;background:#18251d;border-radius:8px;overflow:hidden}.hp{height:100%;width:100%;background:linear-gradient(90,#cb5b48,#e99c62)}.actions{position:absolute;right:18px;bottom:22px;display:flex;gap:8px;pointer-events:auto}.slot{width:58px;height:58px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(10,24,16,.9);border:2px solid rgba(221,196,133,.25);font-size:23px}.slot small{font-size:9px;color:#cfcca8}.controls{position:absolute;left:18px;bottom:20px;width:150px;height:150px;display:none;pointer-events:auto}.stick{position:absolute;left:20px;bottom:10px;width:106px;height:106px;border-radius:50%;background:rgba(220,235,200,.12);border:2px solid rgba(240,240,210,.2)}.knob{position:absolute;width:48px;height:48px;border-radius:50%;left:29px;top:29px;background:rgba(238,226,179,.55);border:2px solid rgba(255,255,220,.55)}.interact{position:absolute;right:24px;bottom:112px;width:70px;height:70px;border-radius:50%;font-size:13px;font-weight:bold;background:rgba(180,209,128,.22);border:2px solid rgba(220,240,190,.45);display:none;pointer-events:auto}.toast{position:absolute;left:50%;bottom:92px;transform:translate(-50%,20px);padding:9px 14px;border-radius:20px;background:#17281b;border:1px solid #d4c18a;opacity:0;transition:.25s}.toast.show{opacity:1;transform:translate(-50%,0)}.start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 45%,rgba(62,89,51,.3),rgba(5,11,8,.94));pointer-events:auto}.card{width:min(480px,calc(100% - 32px));text-align:center;padding:34px 28px}.card h1{margin:0;font-family:Georgia,serif;font-size:48px;text-shadow:0 4px #182117}.card h1 span{display:block;font-size:15px;color:#dfc77e;letter-spacing:7px;text-transform:uppercase;margin-top:8px}.card p{color:#bac9af;line-height:1.6}.card button{border:0;border-radius:12px;padding:14px 30px;background:#bca566;color:#172018;font-weight:900;font-size:16px;cursor:pointer;box-shadow:0 5px 0 #756740}.card button:active{transform:translateY(3px);box-shadow:none}.hurt{position:absolute;inset:0;background:red;opacity:0;transition:.12s}.gameover{display:none}.gameover.show{display:flex}.hotkeys{position:absolute;left:18px;bottom:18px;color:#96a58e;font-size:11px}@media(pointer:coarse),(max-width:800px){.controls{display:block}.interact{display:block}.actions{bottom:18px}.slot{width:50px;height:50px}.health{bottom:164px;width:38vw}.quest{top:82px;width:180px}.resources{top:12px;left:12px}.minimap{width:110px;height:110px;right:12px;top:12px}.topbar{top:12px}.hotkeys{display:none}.card h1{font-size:38px}}
</style></head>
<body>
<canvas id="game"></canvas><div class="vignette"></div>
<div class="ui">
<div class="resources panel"><div class="res"><span>WOOD</span><b id="wood">20</b></div><div class="res"><span>STONE</span><b id="stone">8</b></div><div class="res"><span>MEAT</span><b id="meat">3</b></div></div>
<div class="topbar"><div class="night panel"><small>NIGHT</small><b id="night">1 / 99</b></div><div class="timer panel" id="timer">SUNRISE 4:30</div></div>
<div class="quest panel"><h3>Tonight's objective</h3><p id="questText">Keep the fire burning</p><div class="bar"><div class="fill" id="questFill"></div></div></div>
<div class="minimap panel"><canvas id="map" width="145" height="145"></canvas></div>
<div class="health panel"><label><span>HEALTH</span><span id="hpText">100</span></label><div class="hpbg"><div class="hp" id="hp"></div></div></div>
<div class="actions"><div class="slot" title="Torch">🔥<small>1</small></div><div class="slot" title="Axe">🪓<small>2</small></div><div class="slot" title="Campfire">🔥<small>3</small></div></div>
<div class="controls" id="controls"><div class="stick" id="stick"><div class="knob" id="knob"></div></div></div><button class="interact" id="interact">GATHER</button>
<div class="toast" id="toast">Wood collected</div><div class="hurt" id="hurt"></div>
</div>
<div class="start" id="start"><div class="card panel"><h1>99<span>NIGHTS IN THE FOREST</span></h1><p>Gather wood. Feed the fire. Survive the dark.<br>How many nights can you endure?</p><button id="play">ENTER THE FOREST</button></div></div>
<div class="start gameover" id="gameover"><div class="card panel"><h1>THE FOREST WON<span id="endTitle">NIGHT 1</span></h1><p id="endText">The fire went out...</p><button id="again">TRY AGAIN</button></div></div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d'),map=document.getElementById('map'),mctx=map.getContext('2d');let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}addEventListener('resize',resize);
resize();
let running=false,gameOver=false,last=0,day=1,time=270,hp=100,score=0;const player={x:0,y:0,r:12,angle:0,inv:0};let keys={},joystick={x:0,y:0},trees=[],rocks=[],animals=[],camp={x:0,y:0,fire:100};
function rand(a,b){return a+Math.random*(b-a)}
function seedWorld(){trees=[];rocks=[];animals=[];for(let i=0;i<260;i++){let a=Math.random()*Math.PI*2,d=180+Math.random()*1100,x=Math.cos(a)*d,y=Math.sin(a)*d;if(Math.hypot(x,y)<150)continue;trees.push({x,y,s:.75+Math.random*.7,hp:2})}for(let i=0;i<55;i++){let a=Math.random()*6.28,d=220+Math.random()*900;rocks.push({x:Math.cos(a)*d,y:Math.sin(a)*d,hp:2})}for(let i=0;i<12;i++){let a=Math.random()*6.28,d=300+Math.random()*700;animals.push({x:Math.cos(a)*d,y:Math.sin(a)*d,type:Math.random()<.35?'wolf':'deer',phase:Math.random()*6})}}
seedWorld();
const inv={wood:20,stone:8,meat:3};
addEventListener('keydown',e=>{keys[e.key.toLower]=true;keys[e.key.toLowerCase()]=true;if(e.key===' '||e.key==='e')interact()});addEventListener('keyup',e=>{keys[e.key.toLower]=false;keys[e.key.toLowerCase()]=false});
function toast(t){let el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el.t);el.t=setTimeout(()=>el.classList.remove('show'),1200)}
function interact(){if(!running)return;let nearest=null,dist=55;for(const t of trees){let d=Math.hypot(t.x-player.x,t.y-player.y);if(d<dist){dist=d;nearest=t}}if(nearest){nearest.hp--;inv.wood+=1;toast('Axe: +1 wood');if(nearest.hp<=0){nearest.dead=true;trees=trees.filter(t=>!t.dead)}return}for(const r of rocks){let d=Math.hypot(r.x-player.x,r.y-player.y);if(d<dist){dist=d;nearest=r}}if(nearest){nearest.hp--;inv.stone+=1;toast('Pickaxe: +1 stone');if(nearest.hp<=0)nearest.dead=true;rocks=rocks.filter(r=>!r.dead);return}if(Math.hypot(player.x-camp.x,player.y-camp.y)<90){if(inv.wood>=3){inv.wood-=3;camp.fire=Math.min(100,camp.fire+25);toast('Fire restored')}else toast('Need 3 wood')}updateUI()}
const ia=document.getElementById('interact');ia.addEventListener('pointerdown',e=>{e.preventDefault();interact()});
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let active=false;
stick.addEventListener('pointerdown',e=>{active=true;stick.setPointerCapture(e.pointerId)});stick.addEventListener('pointermove',e=>{if(!active)return;let r=stick.getBoundingRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,x=e.clientX-cx,y=e.clientY-cy,l=Math.hypot(x,y),m=38;if(l>m){x=x/l*m;y=y/l*m}knob.style.transform=`translate(${x}px,${y}px)`;joystick.x=x/m;joystick.y=y/m});function release(){active=false;joystick.x=0;joystick.y=0;knob.style.transform=''}stick.addEventListener('pointerup',release);stick.addEventListener('pointercancel',release);
function updateUI(){document.getElementById('wood').textContent=inv.wood;document.getElementById('stone').textContent=inv.stone;document.getElementById('meat').textContent=inv.meat;document.getElementById('hp').style.width=Math.max(0,hp)+'%';document.getElementById('hpText').textContent=Math.ceil(hp)}
function worldToScreen(x,y){return{x:W/2+(x-player.x),y:H/2+(y-player.y)}}
function drawTree(t){let p=worldToScreen(t.x,t.y);if(p.x<-70||p.x>W+70||p.y<-100||p.y>H+100)return;ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(p.x+10,p.y+15,24*t.s,8*t.s,0,0,7);ctx.fill();ctx.fillStyle='#3e2a19';ctx.fillRect(p.x-5*t.s,p.y-28*t.s,10*t.s,38*t.s);ctx.fillStyle='#1f4a30';ctx.beginPath();ctx.arc(p.x,p.y-32*t.s,25*t.s,0,7);ctx.fill();ctx.fillStyle='#2d6038';ctx.beginPath();ctx.arc(p.x-13*t.s,p.y-42*t.s,17*t.s,0,7);ctx.arc(p.x+12*t.s,p.y-47*t.s,16*t.s,0,7);ctx.fill()}
function draw(){ctx.fillStyle='#1a3323';ctx.fillRect(0,0,W,H);let grid=80,ox=-((player.x%grid)+grid)%grid,oy=-((player.y%grid)+grid)%grid;ctx.strokeStyle='rgba(180,210,160,.025)';ctx.lineWidth=1;for(let x=ox-W/2;x<W;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=oy-H/2;y<H;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
let cp=worldToScreen(camp.x,camp.y);ctx.fillStyle='#62513a';ctx.beginPath();ctx.ellipse(cp.x,cp.y+12,74,38,0,0,7);ctx.fill();ctx.fillStyle='#78674a';for(let i=-3;i<4;i++){ctx.beginPath();ctx.ellipse(cp.x+i*20,cp.y+4+(i%2)*8,18,7,0,0,7);ctx.fill()}let flame=camp.fire/100;ctx.fillStyle='#f6b64a';ctx.beginPath();ctx.moveTo(cp.x-13,cp.y+5);ctx.quadraticCurveTo(cp.x-5,cp.y-35-14*Math.sin(performance.now()/160),cp.x,cp.y-48*flame);ctx.quadraticCurveTo(cp.x+14,cp.y-22,cp.x+16,cp.y+5);ctx.fill();ctx.fillStyle='#fff0a2';ctx.beginPath();ctx.arc(cp.x,cp.y-12,7,0,7);ctx.fill();ctx.strokeStyle='#4a3522';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(cp.x-20,cp.y);ctx.lineTo(cp.x+20,cp.y+8);ctx.moveTo(cp.x+20,cp.y);ctx.lineTo(cp.x-20,cp.y+8);ctx.stroke();
rocks.forEach(r=>{let p=worldToScreen(r.x,r.y);if(p.x>-30&&p.x<W+30&&p.y>-30&&p.y<H+30){ctx.fillStyle='#667064';ctx.beginPath();ctx.moveTo(p.x-16,p.y+8);ctx.lineTo(p.x-10,p.y-12);ctx.lineTo(p.x+10,p.y-14);ctx.lineTo(p.x+18,p.y+7);ctx.closePath();ctx.fill()}});
trees.sort((a,b)=>a.y-b.y).forEach(drawTree);
animals.forEach(a=>{a.phase+=.008;let p=worldToScreen(a.x,a.y);if(p.x<-50||p.x>W+50||p.y<-50||p.y>H+50)return;ctx.save();ctx.translate(p.x,p.y);ctx.fillStyle=a.type==='wolf'?'#7a7d73':'#9a7953';ctx.beginPath();ctx.ellipse(0,0,17,9,0,0,7);ctx.fill();ctx.fillStyle=a.type==='wolf'?'#62665f':'#b49163';ctx.beginPath();ctx.ellipse(14, -4,8,6,0,0,7);ctx.fill();ctx.restore()});
let p={x:W/2,y:H/2};ctx.save();ctx.translate(p.x,p.y);ctx.rotate(player.angle);ctx.fillStyle='#17251d';ctx.beginPath();ctx.ellipse(-2,8,13,5,0,0,7);ctx.fill();ctx.fillStyle='#d1a875';ctx.beginPath();ctx.arc(0,-8,10,0,7);ctx.fill();ctx.fillStyle='#4b3425';ctx.beginPath();ctx.arc(-2,-10,11,Math.PI,Math.PI*2);ctx.fill();ctx.fillStyle='#7b3f2f';ctx.beginPath();ctx.moveTo(-9,-2);ctx.lineTo(9,-2);ctx.lineTo(8,12);ctx.lineTo(-8,12);ctx.closePath();ctx.fill();ctx.restore();
let darkness=1-Math.max(0,Math.sin((time/270)*Math.PI));if(time>210||time<90)darkness=.78;ctx.fillStyle=`rgba(5,12,22,${darkness*.55})`;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='destination-out';let grad=ctx.createRadialGradient(W/2,H/2,20,W/2,H/2,day%2?260:190);grad.addColorStop(0,'rgba(0,0,0,1)');grad.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=grad;ctx.beginPath();ctx.arc(W/2,H/2,day%2?260:190,0,7);ctx.fill();ctx.globalCompositeOperation='source-over';drawMap()}
function drawMap(){mctx.fillStyle='#183522';mctx.fillRect(0,0,145,145);mctx.fillStyle='#d7b86f';mctx.beginPath();mctx.arc(72+(camp.x-player.x)/10,72+(camp.y-player.y)/10,4,0,7);mctx.fill();mctx.fillStyle='#eee';mctx.beginPath();mctx.arc(72,72,3,0,7);mctx.fill();trees.forEach(t=>{let x=72+(t.x-player.x)/10,y=72+(t.y-player.y)/10;if(x>-4&&x<149&&y>-4&&y<149){mctx.fillStyle='#315e3d';mctx.fillRect(x,y,2,2)}})}
function update(dt){if(!running)return;let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joystick.x,dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joystick.y,l=Math.hypot(dx,dy);if(l){dx/=l;dy/=l;player.x+=dx*150*dt;player.y+=dy*150*dt;player.angle=Math.atan2(dy,dx)+Math.PI/2}time+=dt*3.7;if(time>=540){time=0;day++;document.getElementById('night').textContent=day+' / 99';toast('A new day dawns');inv.wood+=2}camp.fire-=dt*(day>5?1.2:.75);if(camp.fire<=0){hp-=dt*2}else if(Math.hypot(player.x-camp.x,player.y-camp.y)<100){hp=Math.min(100,hp+dt*.5)}animals.forEach(a=>{let d=Math.hypot(a.x-player.x,a.y-player.y);if(a.type==='wolf'&&d<300){let vx=(player.x-a.x)/d,vy=(player.y-a.y)/d;a.x+=vx*dt*(45+day*.4);a.y+=vy*dt*(45+day*.4);if(d<28){hp-=dt*(7+day*.15)}}else if(a.type==='deer'&&d<180){a.x-=Math.cos(a.phase)*dt*20;a.y-=Math.sin(a.phase)*dt*20}});if(hp<=0)end();let half=time<270?'SUNRISE':'SUNSET';let m=Math.floor((540-time)%540/9);if(m<0)m+=60;document.getElementById('timer').textContent=half+' '+Math.floor(m/10)+':'+String(m%10).padStart(2,'0')+'0';document.getElementById('questFill').style.width=Math.max(0,Math.min(100,camp.fire))+'%';updateUI()}
function end(){running=false;gameOver=true;document.getElementById('gameover').classList.add('show');document.getElementById('endTitle').textContent='NIGHT '+day;document.getElementById('endText').textContent=camp.fire<=0?'The campfire went out.':'The forest claimed you.'}
function loop(t){let dt=Math.min(.033,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
document.getElementById('play').onclick=()=>{document.getElementById('start').style.display='none';running=true;last=performance.now()};document.getElementById('again').onclick=()=>location.reload();
setInterval(()=>{if(running&&inv.wood>0&&Math.hypot(player.x-camp.x,player.y-camp.y)<70&&camp.fire<100){}},1000);
</script></body></html>
