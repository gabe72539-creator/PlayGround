<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sunny Side Sprint</title>
  <style>
    :root { --sky:#78d6fa; --ink:#17233d; --cream:#fff9df; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#74cdee; }
    body { font-family: "Trebuchet MS", system-ui, sans-serif; color:var(--ink); touch-action:none; }
    #game { display:block; width:100vw; height:100vh; }
    .hud { position:fixed; left:clamp(12px,3vw,36px); right:clamp(12px,3vw,36px); top:max(12px,env(safe-area-inset-top)); display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; z-index:5; }
    .hud-card { height:44px; display:flex; align-items:center; gap:9px; padding:7px 12px 7px 8px; border:3px solid rgba(23,35,61,.16); border-radius:16px; background:rgba(255,249,223,.92); box-shadow:0 5px 0 rgba(23,35,61,.12); font-weight:900; }
    .coin-icon { width:25px;height:25px;border-radius:50%;background:#ffd83d;border:3px solid #e89d1d;box-shadow:inset 4px 0 #fff5a2; }
    .heart { color:#ef5e55; font-size:23px; letter-spacing:-2px; text-shadow:0 2px 0 white; }
    #progressWrap { position:fixed; z-index:5; left:50%; top:max(16px,env(safe-area-inset-top)); transform:translateX(-50%); width:min(240px,30vw); height:12px; border:3px solid rgba(23,35,61,.18); border-radius:99px; background:rgba(255,255,255,.58); overflow:hidden; }
    #progress { height:100%; width:0%; border-radius:99px; background:#ef5e55; transition:width .12s linear; }
    .controls { position:fixed; z-index:6; left:0; right:0; bottom:max(12px,env(safe-area-inset-bottom)); display:flex; justify-content:space-between; align-items:flex-end; padding:0 clamp(12px,4vw,34px); pointer-events:none; }
    .move, .jump { pointer-events:auto; width:82px; height:82px; border:3px solid rgba(23,35,61,.13); border-radius:50%; background:rgba(255,249,223,.82); box-shadow:0 7px 0 rgba(23,35,61,.13); color:var(--ink); font-size:36px; font-weight:900; -webkit-tap-highlight-color:transparent; backdrop-filter:blur(4px); }
    .move { margin-right:8px; }
    .moveSet { display:flex; }
    .jump { width:92px;height:92px;background:rgba(255,216,61,.9); font-size:18px; }
    .pressed { transform:translateY(5px); box-shadow:0 2px 0 rgba(23,35,61,.13); }
    #overlay { position:fixed; inset:0; z-index:10; display:none; align-items:center; justify-content:center; background:rgba(66,175,214,.25); backdrop-filter:blur(5px); }
    #panel { width:min(410px,calc(100vw - 32px)); border:5px solid var(--cream); border-radius:28px; background:#fff9df; box-shadow:0 12px 0 rgba(23,35,61,.16); text-align:center; padding:28px 24px 24px; }
    #panel h1 { margin:0 0 6px; font-size:42px; letter-spacing:-2px; }
    #panel p { margin:8px 0 20px; font-weight:800; color:#66708b; }
    #restart { border:0;border-radius:16px;padding:15px 34px;background:#ef5e55;color:white;font-size:20px;font-weight:900;box-shadow:0 7px 0 #bd3f3b;cursor:pointer; }
    #restart:active { transform:translateY(5px);box-shadow:0 2px 0 #bd3f3b; }
    @media (hover:hover) and (pointer:fine) { .controls { opacity:.2; } .controls:hover { opacity:1; } }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="hud-card"><span class="coin-icon"></span><span id="coins">0 / 10</span></div>
    <div class="hud-card"><span class="heart" id="hearts">♥ ♥ ♥</span></div>
  </div>
  <div id="progressWrap"><div id="progress"></div></div>
  <div class="controls">
    <div class="moveSet">
      <button class="move" id="left" aria-label="Влево">‹</button>
      <button class="move" id="right" aria-label="Вправо">›</button>
    </div>
    <button class="jump" id="jump" aria-label="Прыжок">ПРЫЖОК</button>
  </div>
  <div id="overlay"><div id="panel"><h1 id="title">Ура!</h1><p id="message">Все монеты собраны.</p><button id="restart">ЕЩЁ РАЗ</button></div></div>
<script>
const canvas=document.getElementById('game'), ctx=canvas.getContext('2d');
let W=0,H=0,DPR=1, camera=0, time=0, playing=true;
const world={w:4200,h:720,ground:610};
const keys={left:false,right:false,jump:false};
const player={x:120,y:500,w:46,h:58,vx:0,vy:0,onGround:false,facing:1,lives:3,inv:0,coins:0};
const platforms=[
 {x:-100,y:610,w:860,h:180,t:'ground'}, {x:850,y:610,w:650,h:180,t:'ground'},
 {x:1590,y:610,w:720,h:180,t:'ground'}, {x:2440,y:610,w:620,h:180,t:'ground'},
 {x:3190,y:610,w:1100,h:180,t:'ground'},
 {x:520,y:510,w:160,h:32,t:'brick'}, {x:730,y:440,w:120,h:32,t:'brick'},
 {x:1010,y:500,w:150,h:32,t:'brick'}, {x:1230,y:420,w:150,h:32,t:'brick'},
 {x:1740,y:500,w:160,h:32,t:'brick'}, {x:1960,y:420,w:140,h:32,t:'brick'},
 {x:2180,y:520,w:150,h:32,t:'brick'}, {x:2550,y:500,w:150,h:32,t:'brick'},
 {x:2780,y:410,w:160,h:32,t:'brick'}, {x:3260,y:500,w:150,h:32,t:'brick'},
 {x:3480,y:420,w:150,h:32,t:'brick'}, {x:3720,y:510,w:150,h:32,t:'brick'}
];
const coins=[{x:570,y:450},{x:780,y:380},{x:1060,y:440},{x:1280,y:360},{x:1790,y:440},{x:2010,y:360},{x:2230,y:460},{x:2600,y:440},{x:2830,y:350},{x:3510,y:360}].map(c=>({...c,taken:false}));
const enemies=[{x:930,y:570,w:48,h:48,vx:-80,min:850,max:1480,alive:true},{x:1690,y:570,w:48,h:48,vx:75,min:1600,max:2270,alive:true},{x:2600,y:570,w:48,h:48,vx:-85,min:2480,max:3020,alive:true},{x:3350,y:570,w:48,h:48,vx:75,min:3200,max:4080,alive:true}];
const clouds=[{x:180,y:150,s:1},{x:650,y:100,s:.8},{x:1150,y:170,s:1.1},{x:1800,y:120,s:.9},{x:2450,y:155,s:1.2},{x:3100,y:105,s:.85},{x:3800,y:150,s:1}];
function resize(){ DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; canvas.width=W*DPR; canvas.height=H*DPR; canvas.style.width=W+'px';canvas.style.height=H+'px'; ctx.setTransform(DPR,0,0,DPR,0,0); }
addEventListener('resize',resize); resize();
function rects(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function hitCoin(c){ let cx=c.x+16,cy=c.y+16; return cx>player.x&&cx<player.x+player.w&&cy>player.y&&cy<player.y+player.h; }
function update(dt){
 dt=Math.min(dt,.032); time+=dt;
 if(!playing)return;
 const acc=keys.left?-1500:keys.right?1500:0;
 player.vx+=acc*dt; player.vx*=keys.left||keys.right?0.86:0.76;
 player.vx=Math.max(-290,Math.min(290,player.vx)); if(keys.left)player.facing=-1;if(keys.right)player.facing=1;
 if(keys.jump&&player.onGround){player.vy=-660;player.onGround=false;}
 player.vy+=1700*dt;
 player.vy=Math.min(player.vy,900);
 player.x+=player.vx*dt; player.x=Math.max(0,Math.min(world.w-player.w,player.x));
 player.y+=player.vy*dt; player.onGround=false;
 for(const p of platforms){
  if(rects(player,p)){
   const prevY=player.y-player.vy*dt;
   if(prevY+player.h<=p.y+8&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true;}
   else if(prevY>=p.y+p.h-8&&player.vy<0){player.y=p.y+p.h;player.vy=0;}
   else if(player.x+player.w/2<p.x+p.w/2)player.x=p.x-player.w;else player.x=p.x+p.w;
  }
 }
 for(const c of coins) if(!c.taken&&hitCoin(c)){c.taken=true;player.coins++; document.getElementById('coins').textContent=`${player.coins} / 10`; }
 for(const e of enemies){ if(!e.alive)continue; e.x+=e.vx*dt;if(e.x<e.min||e.x>e.max)e.vx*=-1;if(rects(player,e)&&player.inv<=0){if(player.vy>120&&player.y+player.h-e.y<24){e.alive=false;player.vy=-430;}else damage();}}
 if(player.y>world.h+100)damage(true);
 player.inv=Math.max(0,player.inv-dt);
 camera+=(player.x-W*.38-camera)*Math.min(1,dt*5);camera=Math.max(0,Math.min(world.w-W,camera));
 document.getElementById('progress').style.width=`${Math.max(0,Math.min(100,player.x/(world.w-160)*100))}%`;
 if(player.x>4070)win();
}
function damage(fall=false){ player.lives--; player.inv=1.8; if(fall||player.lives<=0){ if(player.lives<=0){lose();return;} player.x=120;player.y=500;player.vx=0;player.vy=0;}else{player.vy=-420;player.vx=-player.facing*220;} document.getElementById('hearts').textContent='♥ '.repeat(player.lives).trim(); }
function win(){playing=false;document.getElementById('title').textContent='Ура!';document.getElementById('message').textContent=`Финиш! Монет собрано: ${player.coins}/10`;document.getElementById('overlay').style.display='flex';}
function lose(){playing=false;document.getElementById('title').textContent='Ой!';document.getElementById('message').textContent='Попробуй ещё раз — финиш ждёт!';document.getElementById('overlay').style.display='flex';}
function draw(){
 ctx.clearRect(0,0,W,H);
 const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#78d6fa');g.addColorStop(1,'#b8eced');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,239,152,.9)';ctx.beginPath();ctx.arc(W*.82-camera*.03,H*.16,55,0,Math.PI*2);ctx.fill();
 drawClouds(); drawMountains();
 ctx.save();ctx.translate(-camera,0); drawBackDecor();
 for(const p of platforms)drawPlatform(p);
 for(const c of coins)if(!c.taken)drawCoin(c.x,c.y);
 for(const e of enemies)if(e.alive)drawEnemy(e);
 drawFlag(); if(!(player.inv>0&&Math.floor(time*12)%2))drawPlayer(); ctx.restore();
}
function drawClouds(){for(const c of clouds){let x=c.x-camera*.18;if(x<-180)x+=world.w*.95;let y=c.y*c.s;ctx.fillStyle='rgba(255,255,255,.82)';ctx.beginPath();ctx.arc(x,y,28*c.s,0,7);ctx.arc(x+35*c.s,y-10*c.s,38*c.s,0,7);ctx.arc(x+75*c.s,y,30*c.s,0,7);ctx.fill();}}
function drawMountains(){ctx.fillStyle='#82c9a1';ctx.beginPath();ctx.moveTo(0,H);for(let x=-100;x<W+300;x+=260){let px=x-camera*.08;ctx.lineTo(px,H*.72);ctx.lineTo(px+130,H*.48);ctx.lineTo(px+260,H*.72);}ctx.lineTo(W,H);ctx.fill();ctx.fillStyle='#62b58e';for(let x=-160;x<W+300;x+=340){let px=x-camera*.12;ctx.beginPath();ctx.moveTo(px,H);ctx.lineTo(px+170,H*.58);ctx.lineTo(px+340,H);ctx.fill();}}
function drawBackDecor(){ctx.fillStyle='#5caa82';for(let x=40;x<world.w;x+=180){ctx.fillRect(x,590-(Math.sin(x)*20+20),55,40);ctx.beginPath();ctx.arc(x+28,552-(Math.sin(x)*20+20),34,0,7);ctx.fill();}}
function drawPlatform(p){if(p.t==='ground'){ctx.fillStyle='#65b84d';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#80cf55';ctx.fillRect(p.x,p.y,p.w,18);ctx.fillStyle='#d99b4c';ctx.fillRect(p.x,p.y+18,p.w,p.h-18);ctx.fillStyle='rgba(112,74,43,.16)';for(let x=p.x+20;x<p.x+p.w;x+=58){ctx.fillRect(x,p.y+48,28,28);ctx.fillRect(x+28,p.y+82,28,28);}}else{ctx.fillStyle='#efc46d';ctx.fillRect(p.x,p.y,p.w,p.h);ctx.strokeStyle='#c58c44';ctx.lineWidth=4;ctx.strokeRect(p.x,p.y,p.w,p.h);ctx.fillStyle='#dba85b';for(let x=p.x+30;x<p.x+p.w;x+=35)ctx.fillRect(x,p.y+4,3,p.h-8);}}
function drawCoin(x,y){let bob=Math.sin(time*4+x)*4,s=18+Math.sin(time*5+x)*3;ctx.fillStyle='#e7a51a';ctx.beginPath();ctx.ellipse(x+16,y+16+bob,s,20,0,0,7);ctx.fill();ctx.fillStyle='#ffd84b';ctx.beginPath();ctx.ellipse(x+14,y+15+bob,s-5,17,0,0,7);ctx.fill();ctx.fillStyle='#fff4a0';ctx.fillRect(x+7,y+7+bob,4,16);}
function drawEnemy(e){let y=e.y+Math.sin(time*8+e.x)*2;ctx.fillStyle='#5b3e38';ctx.beginPath();ctx.roundRect(e.x,y,e.w,e.h,13);ctx.fill();ctx.fillStyle='#f3dfb4';ctx.fillRect(e.x+9,y+25,30,14);ctx.fillStyle='#fff';ctx.fillRect(e.x+8,y+12,10,12);ctx.fillRect(e.x+30,y+12,10,12);ctx.fillStyle='#17233d';ctx.fillRect(e.x+12,y+16,4,6);ctx.fillRect(e.x+34,y+16,4,6);ctx.fillStyle='#3d2a27';ctx.fillRect(e.x-2,y+42,18,7);ctx.fillRect(e.x+32,y+42,18,7);}
function drawPlayer(){ctx.save();ctx.translate(player.x+player.w/2,player.y+player.h/2);ctx.scale(player.facing,1);ctx.translate(-player.w/2,-player.h/2);ctx.fillStyle='#26344f';ctx.fillRect(8,49,11,9);ctx.fillRect(28,49,11,9);ctx.fillStyle='#ef5e55';ctx.fillRect(7,27,32,24);ctx.fillStyle='#f7b24d';ctx.fillRect(12,20,23,14);ctx.fillStyle='#4a9ed1';ctx.fillRect(11,38,24,15);ctx.fillStyle='#8c4d32';ctx.fillRect(8,13,31,10);ctx.fillStyle='#ef5e55';ctx.fillRect(4,9,31,9);ctx.fillStyle='#f7c797';ctx.fillRect(9,20,24,16);ctx.fillStyle='#17233d';ctx.fillRect(22,23,4,5);ctx.fillRect(8,46,8,5);ctx.fillRect(31,46,8,5);ctx.restore();}
function drawFlag(){ctx.fillStyle='#5a6a82';ctx.fillRect(4025,350,8,260);ctx.fillStyle='#ef5e55';ctx.beginPath();ctx.moveTo(4033,365);ctx.quadraticCurveTo(4100,345,4150,375);ctx.lineTo(4100,425);ctx.quadraticCurveTo(4065,405,4033,420);ctx.fill();ctx.fillStyle='#ffd83d';ctx.beginPath();ctx.arc(4029,350,16,0,7);ctx.fill();}
let last=performance.now();function loop(now){let dt=(now-last)/1000;last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
addEventListener('keydown',e=>{if(['ArrowLeft','KeyA'].includes(e.code)){keys.left=true;e.preventDefault()}if(['ArrowRight','KeyD'].includes(e.code)){keys.right=true;e.preventEventDefault&&e.preventEventDefault()}if(['ArrowRight','KeyD'].includes(e.code))e.preventDefault();if(['ArrowUp','KeyW','Space'].includes(e.code)){keys.jump=true;e.preventDefault()}});
addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))keys.left=false;if(['ArrowRight','KeyD'].includes(e.code))keys.right=false;if(['ArrowUp','KeyW','Space'].includes(e.code))keys.jump=false;});
function bind(id,key){const el=document.getElementById(id);const down=e=>{e.preventDefault();keys[key]=true;el.classList.add('pressed')};const up=e=>{e.preventDefault();keys[key]=false;el.classList.remove('pressed')};el.addEventListener('pointerdown',down);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);el.addEventListener('pointerleave',up);}
bind('left','left');bind('right','right');bind('jump','jump');
document.getElementById('restart').onclick=()=>{location.reload();};
</script>
</body>
</html>
